services:
  postgres:
    image: postgres:16-alpine
    container_name: antiban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wa_saas}
    volumes:
      - antiban_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-wa_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: antiban-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - antiban_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./Ant_Engine_Bn
    container_name: antiban-engine
    restart: unless-stopped
    # segredos (ENGINE_API_KEY, SESSIONS_ENCRYPTION_KEY, META_INSTANCES) vem do
    # proprio .env do engine - nao duplicar aqui
    env_file:
      - ./Ant_Engine_Bn/.env
    environment:
      ENGINE_PORT: 3001
      SESSIONS_DIR: /app/sessions
    volumes:
      - antiban_engine_sessions:/app/sessions

  crm-api:
    build:
      context: ./Ant_CRM_Bn
    container_name: antiban-crm-api
    restart: unless-stopped
    # segredos (CRM_JWT_SECRET, CRM_ADMIN_*, ENGINE_API_KEY) vem do proprio .env
    # do CRM - nao duplicar aqui
    env_file:
      - ./Ant_CRM_Bn/.env
    environment:
      CRM_PORT: 3002
      DB_HOST: postgres
      REDIS_HOST: redis
      ENGINE_API_URL: http://engine:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started

  crm-web:
    build:
      context: ./Ant_CRM_Web
    container_name: antiban-crm-web
    restart: unless-stopped
    depends_on:
      - crm-api
    # porta interna 80 (nginx) - configure o dominio dessa app na UI do
    # Dokploy apontando pra esse servico/porta (Traefik cuida do HTTPS)

  msg-worker:
    build:
      context: ./Ant_MSG_Bn
    container_name: antiban-msg-worker
    restart: unless-stopped
    # segredos (ENGINE_API_KEY) vem do proprio .env do worker - nao duplicar aqui
    env_file:
      - ./Ant_MSG_Bn/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      ENGINE_API_URL: http://engine:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started

volumes:
  antiban_postgres_data:
  antiban_redis_data:
  antiban_engine_sessions:
