server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Front chama sempre "/api" (mesma origem - ver Ant_CRM_Web/src/lib/api.ts).
    # Proxeia pro crm-api dentro da rede do compose, igual o proxy do Vite em
    # dev, pra nao depender de roteamento por path no Traefik do Dokploy.
    location /api/ {
        proxy_pass http://crm-api:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA (react-router com BrowserRouter) - qualquer rota desconhecida cai no
    # index.html, o roteamento client-side assume a partir dai.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
